# YOLO-ULM 化的双属性装甲板 pose 模型 (CVPR 2026, Han et al.)
# 改动 (基于 yolo26n-armor-dual-pose.yaml, 论文 3.1/3.2 节):
#   - C3k2 聚合 -> D3C2f (大核深度卷积 D3 block, 感受野更大, 参数 -35.7%)
#   - 下采样 Conv -> RepDown (训练双分支 7x7+3x3 DW, 推理 Conv+BN 融合)
#   - 损失: 环境变量 ULM_FOCIOU=1 启用 FoCIoU (论文 3.3)
# 头不变: DualPoseHead(nc=7 + nc_color=3 + 4角点), 输入输出与 ft 系列完全一致
# 用法: PYTHONPATH=ultralytics-ulm yolo pose train model=yolo26ulm-armor-dual-pose.yaml ...

# Parameters
nc: 7
end2end: False
nc_color: 3
kpt_shape: [4, 3]
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# backbone (YOLO26 + ULM 模块)
backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, D3C2f, [256, False, 0.25]] # 2  <- C3k2 -> D3C2f
  - [-1, 1, RepDown, [256]] # 3-P3/8          <- Conv -> RepDown
  - [-1, 2, D3C2f, [512, False, 0.25]] # 4
  - [-1, 1, RepDown, [512]] # 5-P4/16          <- Conv -> RepDown
  - [-1, 2, D3C2f, [512, True]] # 6
  - [-1, 1, RepDown, [1024]] # 7-P5/32         <- Conv -> RepDown
  - [-1, 2, D3C2f, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

# head (P4/P3 两个下采样同样 RepDown)
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, D3C2f, [512, True]] # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, D3C2f, [256, True]] # 16 (P3/8-small)

  - [-1, 1, RepDown, [256]] # 17                <- Conv -> RepDown
  - [[-1, 13], 1, Concat, [1]] # cat head P4
  - [-1, 2, D3C2f, [512, True]] # 19 (P4/16-medium)

  - [-1, 1, RepDown, [512]] # 20                <- Conv -> RepDown
  - [[-1, 10], 1, Concat, [1]] # cat head P5
  - [-1, 1, D3C2f, [1024, True, 0.5, True]] # 22 (P5/32-large)

  - [[16, 19, 22], 1, DualPoseHead, [nc, nc_color, kpt_shape]] # DualPose(P3, P4, P5)
