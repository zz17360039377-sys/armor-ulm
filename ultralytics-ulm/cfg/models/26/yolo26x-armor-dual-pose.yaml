# 双属性装甲板 pose 模型 —— YOLO26 骨干 + DualPoseHead(本项目定制)
# 头: 车辆类别分支(nc=7) + 颜色分支(nc_color=3, 0红 1蓝 2灰死亡) + 4角点
# 训练入口: tools/train/train_dual_pose.py  (PRETRAIN 用 yolo26x-pose.pt / yolo26n-pose.pt)
# 尺寸由文件名决定(ultralytics 约定): yolo26[x|n]-armor-dual-pose.yaml
#   x 版可直接吃 yolo26x-pose.pt 的骨干/颈部预训练权重(同构同宽)
# 经典 TAL+NMS 路径(end2end=False), 配套 DualPoseLoss(6项损失含 color_loss)

# Parameters
nc: 7 # 车辆类别数(0哨兵 1~4号 5前哨站 6基地)
end2end: False # 经典 NMS 路径(DualPoseLoss/DualPoseValidator 配套)
nc_color: 3 # 颜色类别数(0红 1蓝 2灰死亡)
kpt_shape: [4, 3] # 装甲板四角点 [lt, lb, rb, rt], (x, y, 可见性)
scales: # 与 yolo26-pose.yaml 完全一致 —— 保证与官方权重同构可迁移
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO26n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

# YOLO26n head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, C3k2, [512, True]] # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, C3k2, [256, True]] # 16 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]] # cat head P4
  - [-1, 2, C3k2, [512, True]] # 19 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]] # cat head P5
  - [-1, 1, C3k2, [1024, True, 0.5, True]] # 22 (P5/32-large)

  - [[16, 19, 22], 1, DualPoseHead, [nc, nc_color, kpt_shape]] # DualPose(P3, P4, P5)
