# 双属性装甲板 pose 模型(本项目定制, 基于 YOLOv8n-pose 结构)
# 头: DualPose = 车辆类别分支(nc=7) + 颜色分支(nc_color=3) + 4关键点
# 训练入口: tools/train/train_dual_pose.py
# 说明: 数据管线内部类别为 combined = 颜色idx * 7 + 车辆idx, DualPoseLoss 在损失层拆分;
#       推理输出 [框4, 车辆cls 7, 关键点 8, 颜色 3] —— 颜色在最后, 标准 pose 工具链不受影响

# Parameters
nc: 7 # 车辆类别数(0哨兵 1~4号 5前哨站 6基地, 即标签里的输出idx)
nc_color: 3 # 颜色类别数(0红 1蓝 2灰死亡; v2数据集含灰, 必须为3)
kpt_shape: [4, 3] # 装甲板四角点(x, y, 可见性; 与提取标签一致)
scales: # model compound scaling constants, i.e. 'model=armor-dual-pose.yaml' with scale 'n'
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

# YOLOv8.0n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 3, C2f, [128, True]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 6, C2f, [256, True]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 6, C2f, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 3, C2f, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]] # 9

# YOLOv8.0n head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 3, C2f, [512]] # 12

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 3, C2f, [256]] # 15 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 12], 1, Concat, [1]] # cat head P4
  - [-1, 3, C2f, [512]] # 18 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 9], 1, Concat, [1]] # cat head P5
  - [-1, 3, C2f, [1024]] # 21 (P5/32-large)

  - [[15, 18, 21], 1, DualPoseHead, [nc, nc_color, kpt_shape]] # DualPose(P3, P4, P5) 车辆7类+颜色3类
